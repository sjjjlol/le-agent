[project]
name = "le-agent-cli"
version = "0.1.0"
description = "Claude Code inspired terminal coding agent"
requires-python = ">=3.12"
dependencies = [
  "le-agent-ai",
  "le-agent-core",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "textual>=1.0",
]

[project.scripts]
le-agent = "le_agent_cli.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
