[project]
name = "le-agent-ai"
version = "0.1.0"
description = "Canonical model and streaming protocol for le-agent"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.43",
  "openai>=1.58",
  "pydantic>=2.10",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
