[project]
name = "le-agent-core"
version = "0.1.0"
description = "Pi-style agent loop, state and session runtime"
requires-python = ">=3.12"
dependencies = [
  "le-agent-ai",
  "pydantic>=2.10",
  "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
