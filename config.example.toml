# Copy to .le-agent/config.toml in a project or ~/.le-agent/config.toml.
# API keys are deliberately read only from environment variables.
default_model = "claude"
permission = "confirm" # readonly | confirm | trust

[providers.anthropic]
kind = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"

[providers.openai]
kind = "openai"
api_key_env = "OPENAI_API_KEY"

[models.claude]
provider = "anthropic"
id = "claude-sonnet-4-6"
context_window = 200000
max_output_tokens = 16384
supports_tools = true

[models.gpt]
provider = "openai"
id = "gpt-5"
context_window = 128000
max_output_tokens = 16384
supports_tools = true
