name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: uv sync --all-packages --dev --no-editable
      - run: uv run le-agent --help
      - run: uv run ruff check .
      - run: uv run mypy packages
      - run: uv run pytest --cov
      - run: uv run coverage report --include="*/le_agent_core/*" --fail-under=90
