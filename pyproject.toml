[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "le-agent"
version = "0.2.0"
description = "A readable, extensible Python coding agent for the terminal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.0",
    "httpx[socks]>=0.27",
    "packaging>=24.0",
    "pillow>=11.0",
    "pydantic>=2.11",
    "pygments>=2.18",
    "rich>=13.0",
    "tavily-python>=0.7.27",
    "textual>=8.2.8",
    "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/sjjjlol/le-agent"
Issues = "https://github.com/sjjjlol/le-agent/issues"

[project.scripts]
le-agent = "le_agent_coding.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/le_agent_ai", "src/le_agent", "src/le_agent_coding"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["le_agent_ai", "le_agent", "le_agent_coding"]
exclude = ['^src/le_agent_coding/data/benchmark_tasks/[^/]+/workspace/']

[[tool.mypy.overrides]]
module = "pygments.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tavily.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
